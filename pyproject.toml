[project]
name = "game-audio-translator"
version = "0.1.0"
description = "Desktop app to translate game audio to Vietnamese in real time"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "litellm>=1.40.0",
    "pyaudiowpatch>=0.2.12.5; sys_platform == 'win32'",
    "pyaudio>=0.2.14; sys_platform != 'win32'",
    "webrtcvad-wheels>=2.0.10; sys_platform == 'win32'",
    "webrtcvad>=2.0.10; sys_platform != 'win32'",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "keyring>=24.0.0",
    "PySide6>=6.7.0",
    "platformdirs>=4.0.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
]

[tool.uv]
package = false
